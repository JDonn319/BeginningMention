<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- PWA и блокировка масштабирования (viewport-fit=cover растягивает под челку iPhone) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BeginningMention">
    
    <link rel="manifest" href="/manifest.json" />
    
    <title>BeginningMention</title>

    <style>
      /* Глобальный локдаун от скроллов, зумов и выделений */
      :root {
        --bg-color: #000000;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: var(--bg-color);
        overflow: hidden; /* Нет скролла */
        
        /* Запрет выделения текста и элементов */
        -webkit-user-select: none;
        user-select: none;
        
        /* Запрет контекстного меню и лупы на iOS */
        -webkit-touch-callout: none;
        
        /* Запрет перетаскивания картинок/ссылок */
        -webkit-user-drag: none;
        
        /* Фикс для iOS, чтобы клики не подсвечивались серым квадратом */
        -webkit-tap-highlight-color: transparent;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
